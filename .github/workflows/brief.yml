name: Morning brief

on:
  schedule:
    # 05:30 Hong Kong time = 21:30 UTC the day before.
    # Set early on purpose: GitHub delays scheduled runs 5-30 minutes at peak,
    # so aiming at 06:00 would sometimes land at 06:25.
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # issues: write includes read. The build lists issues labelled mute,
  # including ones that list several stories, comments "Applied", and closes
  # them. The browser never sees this token.
  issues: write

concurrency:
  group: morning-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only feedparser is needed. Gemini is called over plain HTTPS,
      # so there is no SDK to install for the free path.
      - run: pip install feedparser

      # Logic tests only. The headless Chrome check is a separate job so a
      # browser failure cannot stop this job from building and publishing.
      - name: Test mute rules
        run: python test_mute.py --unit

      - name: Build brief
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python build.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Brief $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Report how it built
        run: |
          M=$(python -c "import json;print(json.load(open('data/brief.json'))['build']['method'])")
          echo "Build method: $M"
          if [ "$M" = "rss-only" ]; then
            echo "::warning::Built from RSS summaries - no model key set, or the model call failed."
          fi

  # Runs after the brief is published. continue-on-error keeps a Chrome
  # failure off the workflow result: the daily page must still go out.
  ui-check:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install feedparser

      # Node 20 has no global WebSocket. The mute check opens Chrome's
      # debugger socket itself, and this job runs on Node 22.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Ubuntu 24.04 and later block the user namespaces headless Chrome
      # needs. The process stays up, the debugger port never opens, and the
      # test used to die with "chrome failed:" and an empty message.
      - name: Allow headless Chrome on this runner
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: UI self-test
        run: python test_mute.py --ui
